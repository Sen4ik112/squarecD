<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SquareC — підбір образу на літо</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="splash" id="splash">
    <div class="splash-star">★</div>
  </div>

  <div class="topbar">
    <div class="topbar-center">
      <div class="wordmark">
        <svg class="star" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <path d="M50 5 L61 38 L96 38 L68 59 L79 92 L50 71 L21 92 L32 59 L4 38 L39 38 Z" fill="currentColor"/>
</svg>SQUAREC
        <div class="topbar-photo" id="topbar-photo"><img src="kitty.png" alt="Hello Kitty"></div>
      </div>
      <div class="subtag">---</div>
    </div>
  </div>

  <div class="wrap">

    <!-- ===================== FUTBOLKI ===================== -->
    <section id="tshirts-section">
      <div class="section-head">
        <div class="section-title">ВЕРХ</div>
        <div class="section-counter" id="tshirt-counter">01 / 10</div>
      </div>

      <div class="stage">
        <button class="arrow-btn" onclick="prevItem('tshirt')" aria-label="Попередня футболка">&#8592;</button>
        <div class="card-scene">
          <div class="card-inner" id="tshirt-card">
            <div class="card-face front">
              <img id="tshirt-front-img" alt="Футболка">
            </div>
          </div>
        </div>
        <button class="arrow-btn" onclick="nextItem('tshirt')" aria-label="Наступна футболка">&#8594;</button>
      </div>

      <div class="dots" id="tshirt-dots"></div>
      <div class="item-info" id="tshirt-info"></div>
    </section>

    <!-- ===================== SHORTS ===================== -->
    <section id="shorts-section">
      <div class="section-head">
        <div class="section-title">НИЗ</div>
        <div class="section-counter" id="shorts-counter">01 / 07</div>
      </div>

      <div class="stage">
        <button class="arrow-btn" onclick="prevItem('shorts')" aria-label="Попередні шорти">&#8592;</button>
        <div class="card-scene">
          <div class="card-inner" id="shorts-card">
            <div class="card-face front">
              <img id="shorts-front-img" alt="Шорти">
            </div>
          </div>
        </div>
        <button class="arrow-btn" onclick="nextItem('shorts')" aria-label="Наступні шорти">&#8594;</button>
      </div>

      <div class="dots" id="shorts-dots"></div>
      <div class="item-info" id="shorts-info"></div>
    </section>
    <hr class="divider">

    <!-- ===================== NOTE ===================== -->
    <div class="note-box">
      <div class="note-title">Пам'ятка</div>
      <div class="note-line"><span class="glyph">&#8592; &#8594;</span> стрілочки для навігації</div>
    </div>

  </div>

  <audio id="bg-music" preload="none"></audio>
  <button class="music-btn" id="music-btn" onclick="toggleMusic()">♪</button>

<script>
  // ---------- CONFIG ----------
  const EXT = "jpg";

  const state = {
    tshirt: { count: 10, index: 0 },
    shorts: { count: 7, index: 0 }
  };

  const PLAYLIST = [
    "music1.mp3"
  ];
  let playlistIndex = 0;

  const itemInfo = {
    tshirt: ["", "", "", "", "", "", "", "", ""],
    shorts: ["", "", "", "", ""]
  };

  function photoPath(category, index, side){
    return `photos/${category}_${index + 1}_${side}.${EXT}`;
  }

  function placeholderSVG(category, index, side){
    const label = category === 'tshirt' ? 'Футболка' : 'Шорти';
    const bg = side === 'front' ? '%23f0efea' : '%23e2e0da';
    const svg = `data:image/svg+xml;utf8,
      <svg xmlns='http://www.w3.org/2000/svg' width='280' height='340'>
        <rect width='100%25' height='100%25' fill='${bg}'/>
        <line x1='0' y1='0' x2='280' y2='340' stroke='%23111113' stroke-opacity='0.06' stroke-width='2'/>
        <line x1='280' y1='0' x2='0' y2='340' stroke='%23111113' stroke-opacity='0.06' stroke-width='2'/>
        <text x='50%25' y='45%25' font-family='monospace' font-size='16' fill='%23111113' text-anchor='middle'>${label} ${index + 1}</text>
        <text x='50%25' y='55%25' font-family='monospace' font-size='13' fill='%237c7c81' text-anchor='middle'>вид: ${side === 'front' ? 'перед' : 'зад'}</text>
        <text x='50%25' y='90%25' font-family='monospace' font-size='9' fill='%237c7c81' text-anchor='middle'>photos/${category}_${index+1}_${side}.${EXT}</text>
      </svg>`;
    return svg.replace(/\n/g,'').replace(/\s+/g,' ');
  }

  function setImage(imgEl, category, index, side){
    imgEl.src = photoPath(category, index, side);
    imgEl.onerror = () => {
      imgEl.onerror = null;
      imgEl.src = placeholderSVG(category, index, side);
    };
  }

  function buildDots(category){
    const dotsWrap = document.getElementById(`${category}-dots`);
    dotsWrap.innerHTML = "";
    for(let i = 0; i < state[category].count; i++){
      const dot = document.createElement('button');
      dot.className = 'dot' + (i === state[category].index ? ' active' : '');
      dot.setAttribute('aria-label', `Перейти до ${i+1}`);
      dot.onclick = () => goToIndex(category, i);
      dotsWrap.appendChild(dot);
    }
  }

  function refreshCounter(category){
    const el = document.getElementById(`${category}-counter`);
    const s = state[category];
    const pad = n => String(n).padStart(2, '0');
    el.textContent = `${pad(s.index + 1)} / ${pad(s.count)}`;
  }

  function renderItem(category){
    const s = state[category];
    setImage(document.getElementById(`${category}-front-img`), category, s.index, 'front');
    refreshCounter(category);
    buildDots(category);

    const infoEl = document.getElementById(`${category}-info`);
    const text = (itemInfo[category] && itemInfo[category][s.index]) || "";
    infoEl.classList.remove('show');
    setTimeout(() => {
      infoEl.textContent = text;
      infoEl.classList.add('show');
    }, 120);
  }

  function nextItem(category){
    const s = state[category];
    s.index = (s.index + 1) % s.count;
    bumpCard(category);
    renderItem(category);
  }

  function prevItem(category){
    const s = state[category];
    s.index = (s.index - 1 + s.count) % s.count;
    bumpCard(category);
    renderItem(category);
  }

  function goToIndex(category, i){
    state[category].index = i;
    bumpCard(category);
    renderItem(category);
  }

  function bumpCard(category){
    const card = document.getElementById(`${category}-card`);
    card.classList.remove('bump');
    void card.offsetWidth;
    card.classList.add('bump');
  }



  renderItem('tshirt');
  renderItem('shorts');

  // ==== КОТИК ПРИ ТАПІ/КЛІКУ ====
  // Поклади 4 файли поруч з index.html з такими назвами:
  // tapcat_1.png, tapcat_2.png, tapcat_3.png, tapcat_4.png
  // Якщо якогось файлу немає — з'явиться зірочка-заглушка замість нього.
  const TAP_CATS = ["tapcat_1.png", "tapcat_2.png", "tapcat_3.png", "tapcat_4.png"];

  function spawnTapCat(x, y){
    const img = document.createElement('img');
    img.className = 'tap-cat';
    const pick = TAP_CATS[Math.floor(Math.random() * TAP_CATS.length)];
    img.src = pick;
    img.onerror = () => {
      img.onerror = null;
      img.src = "data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='48' height='48'><text x='50%25' y='55%25' font-size='34' text-anchor='middle' dominant-baseline='middle'>★</text></svg>";
    };
    img.style.left = (x - 24) + 'px'; // центруємо картинку відносно точки тапу
    img.style.top = (y - 24) + 'px';
    document.body.appendChild(img);
    img.addEventListener('animationend', () => img.remove());
  }

  // клік мишкою (десктоп) і тап пальцем (телефон)
  document.addEventListener('click', (e) => {
    spawnTapCat(e.clientX, e.clientY);
  });

  let musicPlaying = false;
  const musicEl = document.getElementById('bg-music');

  function loadTrack(i){
    musicEl.src = PLAYLIST[i];
  }

  musicEl.addEventListener('ended', () => {
    playlistIndex = (playlistIndex + 1) % PLAYLIST.length;
    loadTrack(playlistIndex);
    musicEl.play();
  });

  function toggleMusic(){
    const btn = document.getElementById('music-btn');
    if(musicPlaying){
      musicEl.pause();
      btn.textContent = '♪';
      btn.classList.remove('playing');
    } else {
      if(!musicEl.src){
        loadTrack(playlistIndex);
      }
      musicEl.play();
      btn.textContent = '❚❚';
      btn.classList.add('playing');
    }
    musicPlaying = !musicPlaying;
  }
</script>

</body>
</html>
